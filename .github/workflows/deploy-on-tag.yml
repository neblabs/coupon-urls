name: Build and deploy to wp.org on new tag

on:
  push:
    tags:
      - v*

permissions:
    contents: write
    pull-requests: write
    actions: write # required for cancellations

jobs:
  call_deploy_workflow:
    uses: rafark/cicd-labs/.github/workflows/deploy.yml@main
    with:
      version: ${{ github.ref_name }}
      run-phpunit-tests: false # not for now, we will take care of this later
      run-playwright-tests: true 
      # env versions
      php-version-build: '8.2'
      php-version-lint-build: '8.4'
      php-version-lint-source: '8.4'
      php-version-tests-end: 'latest'
      node-version-build: '16'
    secrets:
      SVN_USER: ${{ secrets.SVN_USER }}
      SVN_PASS: ${{ secrets.SVN_PASS }}
